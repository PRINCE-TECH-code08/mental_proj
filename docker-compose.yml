services:
  api:
    build: .
    ports: ["8000:8000"]
    environment:
      - ALLOWED_ORIGINS=http://localhost:8080,http://127.0.0.1:8080
      - RATE_LIMIT_PER_MIN=60
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
  web:
    image: nginx:alpine
    volumes: ["./frontend:/usr/share/nginx/html:ro"]
    ports: ["8080:80"]
