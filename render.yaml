services:
  - type: web
    name: mental-health-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --app-dir backend --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: ALLOWED_ORIGINS
        value: https://mental-health-prediction-mu.vercel.app
      - key: ENABLE_BASELINE
        value: "0"
